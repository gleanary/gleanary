version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    # Versions we deliberately skip: one entry per decision, with a comment giving the
    # reason and when to revisit (see docs/deps/README.md), mirrored in TECH_DEBT.md.
    ignore:
      # eslint-config-next 16.2.10 bundles an eslint-plugin-react that calls
      # context.getFilename(), removed in ESLint 10: `npm run lint` crashes. Revisit when
      # eslint-config-next supports ESLint 10. 9.x patch/minor bumps keep flowing. (2026-07)
      - dependency-name: "eslint"
        versions: [">=10"]
      # TypeScript 7 (native rewrite): typescript-eslint's peer range caps below it (lint
      # crashes) and Next.js 16.2.10's TS detection fails on its layout (`next build`
      # aborts). Revisit when both declare TS7 support. 6.x bumps keep flowing. (2026-07)
      - dependency-name: "typescript"
        versions: [">=7"]
    # Supply-chain buffer: most hijacked releases are caught and pulled within days, and a
    # week also gives malware feeds time to list them. Security updates ignore cooldown.
    # deps-agent re-checks release age and the malware feed (policy.md).
    cooldown:
      default-days: 7
    groups:
      # react-dom pins an exact react peer (react-dom 19.3.1 needs react@^19.3.1), so a
      # react-dom PR alone fails `npm ci` (PR #60). The four move together, majors
      # included. Listed first: a dependency joins the first group that matches, and the
      # dev-dependencies group would otherwise take @types/react*.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # react-pdf pins an exact pdfjs-dist, and package.json overrides it with ours so the
      # viewer's API and the worker we serve are one copy (PR #72 split them and no PDF
      # rendered). Bumping the two together keeps that override close to react-pdf's pin.
      pdf:
        patterns: ["react-pdf", "pdfjs-dist"]
      # Dev-only patch/minor bumps ship together; production bumps stay one per PR
      # so a production regression maps to exactly one package.
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
  # Base image (docker/Dockerfile, pinned to an exact Node version and digest): Node patch/minor
  # bumps arrive as PRs. deps-agent's ecosystem gate sends them to a human, since the
  # image is the production runtime.
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    ignore:
      # Node majors are a deliberate move to the next LTS (CI, .nvmrc, engines and the
      # image change together), not a Dependabot PR. Revisit each October when a new
      # LTS line starts (next: Node 27, 2027-10). (2026-10)
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["ci"]
    groups:
      # Always human-reviewed (workflow edits): one PR a week, not one per action.
      actions:
        patterns: ["*"]
