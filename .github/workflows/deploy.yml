# Owner-specific deployment: GHCR image push, SSH deploy.
# Runs only after CI succeeds on a push to main of this repository, and only
# when the repository variable DEPLOY_ENABLED is 'true' (forks never set it).
# Server secrets (SERVER_IP, SSH_PRIVATE_KEY) live in the `production`
# environment, which only the main branch can deploy to.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    # workflow_run also fires for CI runs on fork PRs whose branch is named
    # "main": require a push event from this repository.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}:latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Deploy exactly the commit CI tested, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/gleanary
            docker compose pull
            docker compose up -d --remove-orphans
            # Fail the run if the new container never turns healthy: deps-agent reads a
            # failed Deploy as "main is broken" and freezes merges. Old images are only
            # pruned once healthy, so after a failed deploy the previous image is still on
            # the server for a manual rollback (a successful deploy prunes it).
            # The check runs inside the container: the server's compose file does not
            # publish port 3000 on the host (Caddy reaches the app over the Docker network).
            for i in $(seq 1 30); do
              if docker compose exec -T app node -e "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"; then
                docker image prune -f
                exit 0
              fi
              sleep 2
            done
            echo "health check failed after 60s"
            docker compose ps
            exit 1
