name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Unit + Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      # Coverage thresholds live in vitest.config.mts; a drop below the
      # baseline fails this step.
      - run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # CI runs on glibc, but Deploy ships an Alpine (musl) image it only builds after
  # the merge: a native module without a musl prebuild (better-sqlite3) would first
  # fail in production. Build and boot that image on PRs that can change it. The
  # job always reports success when nothing relevant changed, because deps-agent's
  # gate requires it by name (REQUIRED_CHECKS in .github/deps-agent/gate.mjs).
  docker-smoke:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # A PR checks out its merge commit: depth 2 brings its first parent (the base).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # The image's inputs (keep in sync with docker/Dockerfile's COPY lines), plus
      # this file so a change to the job itself exercises the build.
      - name: Detect image-relevant changes
        id: changes
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD |
            grep -qE '^(\.github/workflows/ci\.yml|package(-lock)?\.json|\.dockerignore|next\.config\..*|docker/.*|scripts/(migrate\.mjs|start\.sh))$'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No image-relevant changes, nothing to build."
          fi

      - uses: docker/setup-buildx-action@v4
        if: steps.changes.outputs.build == 'true'

      # Next's output tracing keeps only the build machine's native binaries: amd64 like Deploy.
      - name: Build image (linux/amd64, not pushed)
        if: steps.changes.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: gleanary:ci
          cache-from: type=gha

      # start.sh migrates a fresh DB on an anonymous /data volume, then starts server.js,
      # under the server's runtime hardening (read-only root, no capabilities), so a
      # write outside /data or /tmp fails here instead of in production. Waits on the
      # image's own HEALTHCHECK, the one Deploy's `compose up --wait` uses.
      - name: Migrate, boot and check /api/health
        if: steps.changes.outputs.build == 'true'
        run: |
          docker run -d --name app -p 3000:3000 -e DATABASE_URL=file:/data/db/gleanary.db \
            --read-only --tmpfs /tmp:size=64m --tmpfs /app/.next/cache:uid=1001,gid=1001,size=64m \
            --cap-drop ALL --security-opt no-new-privileges:true --mount type=volume,dst=/data \
            gleanary:ci
          trap 'docker logs app' EXIT
          for i in $(seq 1 45); do
            status=$(docker inspect -f '{{.State.Health.Status}}' app)
            if [ "$status" = healthy ]; then
              curl -fsS http://127.0.0.1:3000/api/health | grep -q '"db":"connected"' && exit 0
              echo "healthy but the database is not connected"
              exit 1
            fi
            [ "$status" = unhealthy ] && break
            sleep 2
          done
          echo "container did not turn healthy (last status: $status)"
          exit 1

  e2e:
    name: E2E Tests (critical paths)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright browsers
        # apt mirrors can stall; fail fast instead of hitting the 6h job ceiling
        timeout-minutes: 10
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        # apt mirrors can stall; fail fast instead of hitting the 6h job ceiling
        timeout-minutes: 10
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run build
      # Real-auth mode: the Playwright config derives SETTINGS_AUTH_HASH from
      # E2E_AUTH_PASSWORD for the spawned server, so the whole suite runs
      # against the built-in auth gate (incl. the login journey spec).
      - run: npx playwright test
        env:
          E2E_AUTH_PASSWORD: gleanary-ci-e2e
          SETTINGS_ENCRYPTION_KEY: aabbccdd11223344aabbccdd11223344aabbccdd11223344aabbccdd11223344

      # Traces (on-first-retry) and the HTML report are the only way to debug a
      # CI-only E2E failure; upload them whenever the run wasn't cancelled so
      # flaky-but-retried passes keep their traces too.
      - name: Upload Playwright report and traces
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
