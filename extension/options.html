<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 400px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        color: #1a1a1a;
        background: #fafaf7;
        padding: 20px;
      }

      h1 {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 16px;
      }

      .field {
        margin-bottom: 16px;
      }

      label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 4px;
        color: #444;
      }

      input[type='text'] {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
        font-family: inherit;
      }

      input[type='text']:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
      }

      .hint {
        font-size: 12px;
        color: #888;
        margin-top: 4px;
      }

      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
      }

      .checkbox-row input[type='checkbox'] {
        margin: 0;
      }

      .actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      button {
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 14px;
        font-family: inherit;
        cursor: pointer;
        border: 1px solid #ddd;
        background: #fff;
        color: #1a1a1a;
      }

      button:hover {
        background: #f0f0ed;
      }

      button.primary {
        background: #2563eb;
        color: #fff;
        border-color: #2563eb;
      }

      button.primary:hover {
        background: #1d4ed8;
      }

      .message {
        font-size: 13px;
        padding: 4px 0;
      }

      .message.success {
        color: #166534;
      }
      .message.error {
        color: #991b1b;
      }
      .message.testing {
        color: #666;
      }
    </style>
  </head>
  <body>
    <h1>Gleanary Clipper Settings</h1>

    <div class="field">
      <label for="api-url">API Base URL</label>
      <input type="text" id="api-url" placeholder="https://gleanary.example.com" />
      <div class="hint">The URL of your self-hosted Gleanary instance</div>
    </div>

    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="reader (optional)" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" />
      <div class="hint">Caddy basic auth credentials</div>
    </div>

    <div class="checkbox-row">
      <input type="checkbox" id="send-html" />
      <label for="send-html">Send page HTML by default (for paywalled content)</label>
    </div>

    <div class="actions">
      <button id="save-btn" class="primary">Save</button>
      <button id="test-btn">Test Connection</button>
      <span id="message" class="message"></span>
    </div>

    <script type="module" src="options.js"></script>
  </body>
</html>
