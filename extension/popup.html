<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 320px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        color: #1a1a1a;
        background: #fafaf7;
      }

      .container {
        padding: 16px;
      }

      h1 {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 12px;
      }

      .status.saving {
        background: #f0f0ed;
        color: #666;
      }

      .status.success {
        background: #dcfce7;
        color: #166534;
      }

      .status.duplicate {
        background: #fef3c7;
        color: #92400e;
      }

      .status.error {
        background: #fee2e2;
        color: #991b1b;
      }

      .status.no-config {
        background: #fef3c7;
        color: #92400e;
      }

      .status.invalid-url {
        background: #f0f0ed;
        color: #666;
      }

      .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid #ccc;
        border-top-color: #666;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .url-text {
        font-size: 12px;
        color: #666;
        word-break: break-all;
        margin-bottom: 12px;
      }

      .options-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        margin-bottom: 12px;
      }

      .options-row input[type='checkbox'] {
        margin: 0;
      }

      .actions {
        display: flex;
        gap: 8px;
      }

      a,
      button {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 13px;
        text-decoration: none;
        cursor: pointer;
        border: 1px solid #ddd;
        background: #fff;
        color: #1a1a1a;
      }

      a:hover,
      button:hover {
        background: #f0f0ed;
      }

      .link-reader {
        color: #2563eb;
        border-color: #2563eb;
      }

      .link-options {
        color: #666;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Gleanary Clipper</h1>

      <div id="status" class="status saving">
        <div class="spinner"></div>
        <span>Saving...</span>
      </div>

      <div id="url-display" class="url-text"></div>

      <div id="options-row" class="options-row" style="display: none">
        <input type="checkbox" id="send-html" />
        <label for="send-html">Include page content (for paywalled articles)</label>
      </div>

      <div id="actions" class="actions" style="display: none"></div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
